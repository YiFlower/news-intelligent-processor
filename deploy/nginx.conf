# 普通API：每IP每秒10个请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 敏感接口：每IP每秒1个请求
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    # Frontend static files
    root /opt/news-platform/prototype/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # 拦截常见扫描路径（直接断开连接）
    location ~* \.(properties|xml|env|bak|sql|log|yml|yaml)$ {
        return 444;
    }
    location ~* /(actuator|swagger|admin|console|heapdump|\.well-known) {
        return 444;
    }

    # 敏感接口：新闻刷新（消耗百度+AI额度），严格限速
    location /api/news/refresh {
        limit_req zone=strict_limit burst=2 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 敏感接口：AI对话（消耗AI额度），严格限速
    location /api/chat {
        limit_req zone=strict_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 普通API：读取缓存数据，宽松限速
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA fallback - all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
